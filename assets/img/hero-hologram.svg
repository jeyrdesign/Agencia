<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" fill="none">
<defs>
 <linearGradient id="glass" x1="210" y1="260" x2="730" y2="890" gradientUnits="userSpaceOnUse"><stop stop-color="#8DFBFF" stop-opacity=".75"/><stop offset=".48" stop-color="#00BFFF" stop-opacity=".26"/><stop offset="1" stop-color="#176BFF" stop-opacity=".12"/></linearGradient>
