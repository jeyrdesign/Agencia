  <style>
    .gallery-hero{padding:90px 0 45px;border-bottom:1px solid var(--line)}.gallery-hero h1{font-size:clamp(42px,7vw,76px);margin:18px 0}.gallery-description{max-width:700px;color:var(--muted);line-height:1.8}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:45px 0 100px}.gallery-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:#0b2232;border:1px solid var(--line);cursor:zoom-in}.gallery-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.2,.75,.25,1),filter .4s}.gallery-photo:hover img{transform:scale(1.045);filter:saturate(1.08)}.gallery-empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.lightbox{position:fixed;inset:0;z-index:80;background:rgba(2,8,14,.94);display:none;place-items:center;padding:35px}.lightbox.open{display:grid}.lightbox img{max-width:min(94vw,1400px);max-height:88vh;object-fit:contain}.lightbox button{position:absolute;top:20px;right:25px;background:transparent;color:#fff;font-size:32px;border:0;cursor:pointer}.gallery-loading{padding:60px 0;color:var(--muted)}.full-portfolio-filters{display:flex;flex-wrap:wrap;gap:9px;margin:34px 0 10px}.full-portfolio-filters button{appearance:none;border:1px solid rgba(132,177,201,.2);background:rgba(13,34,49,.72);color:#a9bfca;padding:10px 15px;font-size:10px;letter-spacing:.025em;cursor:pointer;transition:background .22s,border-color .22s,color .22s,transform .22s}.full-portfolio-filters button:hover{border-color:rgba(0,191,255,.55);color:#eafaff;transform:translateY(-2px)}.full-portfolio-filters button.is-active{background:linear-gradient(110deg,rgba(0,191,255,.18),rgba(8,124,255,.12));border-color:rgba(0,191,255,.68);color:#70dcff}.full-portfolio-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:12px;gap:14px}.full-project{position:relative;display:block;overflow:hidden;min-height:0;grid-row:span 25;border:1px solid var(--line);background:#0b2232;color:inherit;text-decoration:none;isolation:isolate}.full-project:nth-child(5n+1){grid-row:span 30}.full-project:nth-child(5n+3){grid-row:span 28}.full-project img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .55s,filter .4s}.full-project:hover img{transform:scale(1.045);filter:saturate(1.08)}.full-project::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,rgba(3,10,17,.92));z-index:0}.full-project-caption{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:48px 18px 17px;display:grid;gap:7px}.full-project-caption small{color:#7cdef4;font-size:9px;letter-spacing:.08em;text-transform:uppercase}.full-project-caption b{font-size:17px}.full-project-caption span{font-size:10px;color:#c2d3dc;line-height:1.5}.full-portfolio-empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.portfolio-complete-wrap{margin-top:26px}.gallery-project-meta{flex-wrap:wrap}@media(max-width:800px){.full-portfolio-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:10px;gap:11px}.full-project{grid-row:span 25!important}}@media(max-width:520px){.full-portfolio-filters{gap:7px}.full-portfolio-filters button{padding:9px 11px;font-size:9px}.full-portfolio-grid{grid-template-columns:1fr;grid-auto-rows:10px;gap:10px}.full-project{grid-row:span 27!important}.full-project-caption{padding:45px 16px 16px}}.gallery-back{display:inline-block;color:var(--cyan);font-size:12px;margin-top:24px}.gallery-photo.motion-reveal{opacity:0;transform:translateY(18px)}.gallery-photo.motion-reveal.is-visible{opacity:1;transform:none}
    @media(max-width:800px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-hero{padding-top:65px}}
    @media(max-width:520px){.gallery-grid{grid-template-columns:1fr;gap:10px}.gallery-photo{aspect-ratio:5/4}.gallery-hero{padding-top:45px}.lightbox{padding:12px}}
    @media(prefers-reduced-motion:reduce){.gallery-photo img{transition:none}}
  </style>
