<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07121d">
  <title>Galería | JEYR DESIGN</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .gallery-hero{padding:90px 0 45px;border-bottom:1px solid var(--line)}.gallery-hero h1{font-size:clamp(42px,7vw,76px);margin:18px 0}.gallery-description{max-width:700px;color:var(--muted);line-height:1.8}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:45px 0 100px}.gallery-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:#0b2232;border:1px solid var(--line);cursor:zoom-in}.gallery-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.2,.75,.25,1),filter .4s}.gallery-photo:hover img{transform:scale(1.045);filter:saturate(1.08)}.gallery-empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.lightbox{position:fixed;inset:0;z-index:80;background:rgba(2,8,14,.94);display:none;place-items:center;padding:35px}.lightbox.open{display:grid}.lightbox img{max-width:min(94vw,1400px);max-height:88vh;object-fit:contain}.lightbox button{position:absolute;top:20px;right:25px;background:transparent;color:#fff;font-size:32px;border:0;cursor:pointer}.gallery-loading{padding:60px 0;color:var(--muted)}.gallery-back{display:inline-block;color:var(--cyan);font-size:12px;margin-top:24px}.gallery-photo.motion-reveal{opacity:0;transform:translateY(18px)}.gallery-photo.motion-reveal.is-visible{opacity:1;transform:none}
    @media(max-width:800px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-hero{padding-top:65px}}
    @media(max-width:520px){.gallery-grid{grid-template-columns:1fr;gap:10px}.gallery-photo{aspect-ratio:5/4}.gallery-hero{padding-top:45px}.lightbox{padding:12px}}
    @media(prefers-reduced-motion:reduce){.gallery-photo img{transition:none}}
  </style>
</head>
<body>
  <div class="noise"></div>
  <header class="site-header"><nav id="main-nav"><a href="index.html#nosotros">Nosotros</a><a href="index.html#servicios">Servicios</a><a href="index.html#portafolio">Portafolio</a><a class="nav-cta" href="index.html#contacto">Hablemos <span>↗</span></a></nav><button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button></header>
  <main class="section-wrap"><section class="gallery-hero"><div class="section-kicker">JEYR DESIGN / PORTAFOLIO</div><h1 id="gallery-title">Cargando galería<span>…</span></h1><p class="gallery-description" id="gallery-description"></p><a class="gallery-back" href="index.html#portafolio">← Volver al portafolio</a></section><section id="gallery-grid" class="gallery-grid"><p class="gallery-loading">Preparando fotografías…</p></section></main>
  <footer class="site-footer"><p>Los mejores, con los mejores.</p><div><a href="https://www.instagram.com/jeyrdesign/" target="_blank" rel="noopener">Instagram ↗</a><a href="index.html">Inicio</a></div><small>© <span id="year"></span> JEYR DESIGN · Babahoyo, Ecuador</small></footer>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Fotografía ampliada"><button id="lightbox-close" aria-label="Cerrar">×</button><img id="lightbox-image" alt="Fotografía ampliada"></div>
  <script type="module" src="assets/js/gallery.js"></script><script src="assets/js/motion.js" defer></script>
</body></html>
