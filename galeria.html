<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07121d">
  <title>Galería | JEYR DESIGN</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .gallery-hero{padding:90px 0 45px;border-bottom:1px solid var(--line)}.gallery-hero h1{font-size:clamp(42px,7vw,76px);margin:18px 0}.gallery-description{max-width:700px;color:var(--muted);line-height:1.8}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:45px 0 100px}.gallery-photo{position:relative;overflow:hidden;aspect-ratio:4/3;background:#0b2232;border:1px solid var(--line);cursor:zoom-in}.gallery-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.2,.75,.25,1),filter .4s}.gallery-photo:hover img{transform:scale(1.045);filter:saturate(1.08)}.gallery-empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.lightbox{position:fixed;inset:0;z-index:80;background:rgba(2,8,14,.94);display:none;place-items:center;padding:35px}.lightbox.open{display:grid}.lightbox img{max-width:min(94vw,1400px);max-height:88vh;object-fit:contain}.lightbox button{position:absolute;top:20px;right:25px;background:transparent;color:#fff;font-size:32px;border:0;cursor:pointer}.gallery-loading{padding:60px 0;color:var(--muted)}.full-portfolio-filters{display:flex;flex-wrap:wrap;gap:9px;margin:34px 0 10px}.full-portfolio-filters button{appearance:none;border:1px solid rgba(132,177,201,.2);background:rgba(13,34,49,.72);color:#a9bfca;padding:10px 15px;font-size:10px;letter-spacing:.025em;cursor:pointer;transition:background .22s,border-color .22s,color .22s,transform .22s}.full-portfolio-filters button:hover{border-color:rgba(0,191,255,.55);color:#eafaff;transform:translateY(-2px)}.full-portfolio-filters button.is-active{background:linear-gradient(110deg,rgba(0,191,255,.18),rgba(8,124,255,.12));border-color:rgba(0,191,255,.68);color:#70dcff}.full-portfolio-grid{grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:12px;gap:14px}.full-project{position:relative;display:block;overflow:hidden;min-height:0;grid-row:span 25;border:1px solid var(--line);background:#0b2232;color:inherit;text-decoration:none;isolation:isolate}.full-project:nth-child(5n+1){grid-row:span 30}.full-project:nth-child(5n+3){grid-row:span 28}.full-project img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .55s,filter .4s}.full-project:hover img{transform:scale(1.045);filter:saturate(1.08)}.full-project::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,rgba(3,10,17,.92));z-index:0}.full-project-caption{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:48px 18px 17px;display:grid;gap:7px}.full-project-caption small{color:#7cdef4;font-size:9px;letter-spacing:.08em;text-transform:uppercase}.full-project-caption b{font-size:17px}.full-project-caption span{font-size:10px;color:#c2d3dc;line-height:1.5}.full-portfolio-empty{grid-column:1/-1;padding:55px;text-align:center;color:var(--muted);border:1px dashed var(--line)}.portfolio-complete-wrap{margin-top:26px}.full-video-project .video-play-mark{position:absolute;z-index:2;left:50%;top:42%;transform:translate(-50%,-50%);width:58px;height:42px;border-radius:12px;background:#e62117;color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 24px #0008}.youtube-detail-grid{display:block;max-width:1100px;margin-inline:auto}.youtube-player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#050b10;border:1px solid var(--line);box-shadow:0 20px 60px #0005}.youtube-player-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.gallery-project-meta{flex-wrap:wrap}@media(max-width:800px){.full-portfolio-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:10px;gap:11px}.full-project{grid-row:span 25!important}}@media(max-width:520px){.full-portfolio-filters{gap:7px}.full-portfolio-filters button{padding:9px 11px;font-size:9px}.full-portfolio-grid{grid-template-columns:1fr;grid-auto-rows:10px;gap:10px}.full-project{grid-row:span 27!important}.full-project-caption{padding:45px 16px 16px}}.gallery-back{display:inline-block;color:var(--cyan);font-size:12px;margin-top:24px}.gallery-photo.motion-reveal{opacity:0;transform:translateY(18px)}.gallery-photo.motion-reveal.is-visible{opacity:1;transform:none}
    @media(max-width:800px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gallery-hero{padding-top:65px}}
    @media(max-width:520px){.gallery-grid{grid-template-columns:1fr;gap:12px}.gallery-photo{aspect-ratio:4/5}.gallery-hero{padding-top:45px}.lightbox{padding:12px}}
    @media(prefers-reduced-motion:reduce){.gallery-photo img{transition:none}}
    /* Las fotografías de cada proyecto conservan su relación de aspecto real. */
    .gallery-grid:not(.full-portfolio-grid):not(.youtube-detail-grid){align-items:start;grid-auto-rows:auto}
    .gallery-photo{display:block;width:100%;height:auto;min-width:0;aspect-ratio:auto;padding:0;line-height:0;align-self:start}
    .gallery-photo img{display:block;width:100%;height:auto;max-height:none;object-fit:contain;aspect-ratio:auto}
    /* El atributo hidden debe prevalecer sobre el display:flex del grupo de filtros. */
    .full-portfolio-filters[hidden]{display:none!important}
    .full-portfolio-filters{align-items:center}
    .full-portfolio-filters .filters-title{flex:0 0 auto;color:var(--muted);font-size:9px;letter-spacing:.12em;margin-right:5px}
    @media(max-width:520px){
      .gallery-grid:not(.full-portfolio-grid):not(.youtube-detail-grid){grid-template-columns:minmax(0,1fr);gap:14px}
      .gallery-photo{aspect-ratio:auto}
      .gallery-photo img{height:auto;object-fit:contain}
      .full-portfolio-filters{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:2px 0 12px;scrollbar-width:thin;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
      .full-portfolio-filters button{flex:0 0 auto;scroll-snap-align:start}
      .full-portfolio-filters .filters-title{position:sticky;left:0;background:#07121d;padding:8px 5px 8px 0;z-index:2}
    }
    /* Portafolio: las miniaturas usan la proporción intrínseca de cada archivo. */
    .full-portfolio-grid{grid-auto-rows:auto!important;align-items:start;grid-auto-flow:row;}
    .full-project,.full-project:nth-child(5n+1),.full-project:nth-child(5n+3){position:relative;display:flex;flex-direction:column;align-self:start;grid-row:auto!important;height:auto;min-height:0;overflow:hidden;}
    .full-project>img{position:static!important;inset:auto!important;display:block;width:100%;height:auto!important;max-height:none;object-fit:contain!important;aspect-ratio:auto!important;transform:none;}
    .full-project:hover>img{transform:none;filter:saturate(1.06);}
    .full-project::after{display:none!important;}
    .full-project-caption{position:static;left:auto;right:auto;bottom:auto;padding:15px 16px 17px;background:linear-gradient(180deg,rgba(7,18,29,.96),rgba(7,18,29,1));}
    .full-video-project>img{aspect-ratio:16/9!important;object-fit:cover!important;}
    .full-video-project .video-play-mark{top:35%;}
    .full-project .portfolio-event-empty{min-height:150px;display:grid;place-items:center;}
    .full-portfolio-filters[hidden]{display:none!important;}
    @media(max-width:800px){.full-portfolio-grid{grid-auto-rows:auto!important;}}
    @media(max-width:520px){.full-portfolio-grid{grid-template-columns:1fr;grid-auto-rows:auto!important;}.full-project,.full-project:nth-child(5n+1),.full-project:nth-child(5n+3){grid-row:auto!important;}}
  </style>

  <header class="site-header"><a class="brand" href="index.html"><img class="brand-logo-mark" src="assets/img/jeyr-logo.svg" alt="JEYR DESIGN"></a><nav id="main-nav"><a href="index.html#nosotros">Nosotros</a><a href="index.html#servicios">Servicios</a><a href="index.html#portafolio">Portafolio</a><a class="nav-cta" href="index.html#contacto">Hablemos <span>↗</span></a></nav><button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">☰</button></header>
  <main class="section-wrap"><section class="gallery-hero"><div class="section-kicker">JEYR DESIGN / PORTAFOLIO</div><h1 id="gallery-title">Cargando portafolio<span>…</span></h1><p class="gallery-description" id="gallery-description"></p><div class="gallery-project-meta" id="gallery-project-meta" aria-live="polite"></div><a class="gallery-back" id="gallery-back" href="index.html#portafolio">← Volver al sitio</a></section><div class="full-portfolio-filters" id="full-portfolio-filters" role="group" aria-label="Filtrar proyectos" hidden><span class="filters-title">FILTRAR POR</span><button type="button" data-filter="all" class="is-active" aria-pressed="true">Todos</button><button type="button" data-filter="fotografia" aria-pressed="false">Fotografía</button><button type="button" data-filter="eventos" aria-pressed="false">Eventos</button><button type="button" data-filter="deportes" aria-pressed="false">Deportes</button><button type="button" data-filter="xv" aria-pressed="false">XV años</button><button type="button" data-filter="diseno" aria-pressed="false">Diseño gráfico</button><button type="button" data-filter="branding" aria-pressed="false">Branding</button><button type="button" data-filter="audiovisual" aria-pressed="false">Producción audiovisual</button><button type="button" data-filter="digitales" aria-pressed="false">Comunicación digital</button></div><section id="gallery-grid" class="gallery-grid"><p class="gallery-loading">Preparando fotografías…</p></section></main>
